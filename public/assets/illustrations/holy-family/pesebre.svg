<svg viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="La Sagrada Familia en el pesebre">

    <defs>
      <linearGradient id="sky-gradient" x1="0" y1="0" x2="0.25" y2="1">
        <stop offset="0%" stop-color="#0b1228"/>
        <stop offset="48%" stop-color="#1b2a55"/>
        <stop offset="100%" stop-color="#2b3a68"/>
      </linearGradient>

      <radialGradient id="sky-halo" cx="50%" cy="22%" r="60%">
        <stop offset="0%" stop-color="#9a76ad" stop-opacity="0.34"/>
        <stop offset="60%" stop-color="#5b3f6d" stop-opacity="0.1"/>
        <stop offset="100%" stop-color="#16224a" stop-opacity="0"/>
      </radialGradient>

      <linearGradient id="ground-gradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e7d9b4"/>
        <stop offset="55%" stop-color="#d9c79d"/>
        <stop offset="100%" stop-color="#bda877"/>
      </linearGradient>

      <radialGradient id="nativity-disc" cx="50%" cy="38%" r="70%">
        <stop offset="0%" stop-color="#2b3a6e"/>
        <stop offset="55%" stop-color="#1b2749"/>
        <stop offset="100%" stop-color="#111a36"/>
      </radialGradient>

      <radialGradient id="nativity-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#f0dca6" stop-opacity="0.42"/>
        <stop offset="100%" stop-color="#f0dca6" stop-opacity="0"/>
      </radialGradient>

      <radialGradient id="star-halo" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#f0dca6" stop-opacity="0.55"/>
        <stop offset="55%" stop-color="#c6a568" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#c6a568" stop-opacity="0"/>
      </radialGradient>

      <linearGradient id="star-metal" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0%" stop-color="#ffeec2"/>
        <stop offset="55%" stop-color="#c6a568"/>
        <stop offset="100%" stop-color="#8d713f"/>
      </linearGradient>

      <radialGradient id="door-interior" cx="50%" cy="32%" r="70%">
        <stop offset="0%" stop-color="#2a2144"/>
        <stop offset="70%" stop-color="#171f42"/>
        <stop offset="100%" stop-color="#0d1430"/>
      </radialGradient>

      <linearGradient id="gate-recess" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1b2549"/>
        <stop offset="100%" stop-color="#0e1531"/>
      </linearGradient>

      <filter id="scene-soften" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="9"/>
      </filter>

      <filter id="scene-grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="noise"/>
        <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
        <feComponentTransfer in="mono" result="faded">
          <feFuncA type="linear" slope="0.07"/>
        </feComponentTransfer>
        <feComposite operator="over" in2="SourceGraphic"/>
      </filter>

      <filter id="scene-vignette" x="0" y="0" width="100%" height="100%">
        <feGaussianBlur stdDeviation="0"/>
      </filter>
    </defs>

    <g id="scene-nativity" data-layer="nativity">
      <!-- Aros dorados -->
      <circle cx="800" cy="556" r="264" fill="none" stroke="#8d713f" stroke-width="10" opacity="0.85"/>
      <circle cx="800" cy="556" r="253" fill="none" stroke="#f0dca6" stroke-width="3" opacity="0.9"/>
      <circle cx="800" cy="556" r="248" fill="url(#nativity-disc)"/>

      <!-- Resplandor interior -->
      <ellipse cx="800" cy="466" rx="230" ry="180" fill="url(#nativity-glow)"/>

      <!-- Rays -->
      <g id="nativity-rays" data-layer="rays"><line x1="874.0" y1="436.0" x2="990.0" y2="436.0" stroke="#f0dca6" stroke-width="2" opacity="0.28"/><line x1="864.1" y1="462.0" x2="964.5" y2="502.0" stroke="#f0dca6" stroke-width="2" opacity="0.28"/><line x1="837.0" y1="481.0" x2="895.0" y2="550.3" stroke="#f0dca6" stroke-width="2" opacity="0.28"/><line x1="800.0" y1="488.0" x2="800.0" y2="568.0" stroke="#f0dca6" stroke-width="2" opacity="0.28"/><line x1="763.0" y1="481.0" x2="705.0" y2="550.3" stroke="#f0dca6" stroke-width="2" opacity="0.28"/><line x1="735.9" y1="462.0" x2="635.5" y2="502.0" stroke="#f0dca6" stroke-width="2" opacity="0.28"/><line x1="726.0" y1="436.0" x2="610.0" y2="436.0" stroke="#f0dca6" stroke-width="2" opacity="0.28"/><line x1="735.9" y1="410.0" x2="635.5" y2="370.0" stroke="#f0dca6" stroke-width="2" opacity="0.28"/><line x1="763.0" y1="391.0" x2="705.0" y2="321.7" stroke="#f0dca6" stroke-width="2" opacity="0.28"/><line x1="800.0" y1="384.0" x2="800.0" y2="304.0" stroke="#f0dca6" stroke-width="2" opacity="0.28"/><line x1="837.0" y1="391.0" x2="895.0" y2="321.7" stroke="#f0dca6" stroke-width="2" opacity="0.28"/><line x1="864.1" y1="410.0" x2="964.5" y2="370.0" stroke="#f0dca6" stroke-width="2" opacity="0.28"/></g>

      <!-- Establo -->
      <g id="nativity-stable" data-layer="stable">
        <path d="M 650 596 L 800 426 L 950 596 Z" fill="#8c5540" opacity="0.95"/>
        <path d="M 650 596 L 800 426 L 950 596" fill="none" stroke="#c6a568" stroke-width="4" opacity="0.85"/>
        <rect x="658" y="586" width="12" height="150" rx="5" fill="#8c5540"/>
        <rect x="930" y="586" width="12" height="150" rx="5" fill="#8c5540"/>
        <path d="M 670 596 Q 800 564 930 596 L 930 614 Q 800 582 670 614 Z" fill="#bda877" opacity="0.85"/>
        <ellipse cx="800" cy="712" rx="150" ry="26" fill="#bda877" opacity="0.7"/>
      </g>

      <!-- María, arrodillada -->
      <g id="character-mary" data-layer="characters">
        <path d="M 708 706 Q 696 596 738 560 Q 770 530 798 562 Q 818 608 804 706 Z" fill="#3f7f9c"/>
        <path d="M 708 706 Q 740 622 774 602 Q 794 632 804 706 Z" fill="#2f6383" opacity="0.85"/>
        <path d="M 738 560 Q 760 516 794 540 Q 776 558 738 560 Z" fill="#f6f0e5" opacity="0.92"/>
        <circle cx="764" cy="530" r="20" fill="#e8c9a8"/>
        <path d="M 744 526 Q 764 500 784 528 Q 762 518 744 526 Z" fill="#5b3f6d" opacity="0.8"/>
        <path d="M 742 578 Q 772 562 794 580" stroke="#f6f0e5" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.9"/>
      </g>

      <!-- José, de pie con cayado -->
      <g id="character-joseph" data-layer="characters">
        <path d="M 846 706 Q 838 596 858 558 Q 884 538 908 560 Q 924 612 918 706 Z" fill="#b8785c"/>
        <path d="M 886 706 Q 892 610 896 570 L 918 562 Q 926 616 918 706 Z" fill="#8c5540" opacity="0.6"/>
        <circle cx="880" cy="534" r="20" fill="#e8c9a8"/>
        <path d="M 860 528 Q 880 506 900 530 Q 880 522 860 528 Z" fill="#1c2340" opacity="0.7"/>
        <path d="M 858 574 L 830 536" stroke="#bda877" stroke-width="6" stroke-linecap="round"/>
        <path d="M 846 576 Q 822 564 810 578" stroke="#8c5540" stroke-width="6" fill="none" stroke-linecap="round"/>
      </g>

      <!-- El Niño Jesús en el pesebre -->
      <g id="character-baby" data-layer="characters">
        <ellipse cx="808" cy="644" rx="62" ry="18" fill="#bda877" opacity="0.9"/>
        <path d="M 756 644 L 756 606 A 52 26 0 0 1 860 606 L 860 644 Z" fill="#bda877" opacity="0.95"/>
        <ellipse cx="808" cy="608" rx="34" ry="20" fill="#f6f0e5"/>
        <circle cx="808" cy="590" r="17" fill="#f1ddc4"/>
        <circle cx="808" cy="590" r="30" fill="#f0dca6" opacity="0.35"/>
        <path d="M 808 562 l 5 12 13 2 -9 9 2 13 -11 -6 -11 6 2 -13 -9 -9 13 -2 z" fill="#f0dca6" opacity="0.9"/>
      </g>

      <!-- Buey y asno -->
      <g id="scene-animals" data-layer="characters" opacity="0.95">
        <g transform="translate(624 586)">
          <path d="M -34 0 Q -34 -30 -12 -36 Q 10 -42 16 -22 Q 20 -8 8 0 Z" fill="#8c5540"/>
          <path d="M -22 -34 Q -32 -56 -46 -54 Q -38 -40 -34 -30 Z" fill="#8c5540"/>
          <path d="M -6 -36 Q 4 -56 18 -52 Q 6 -40 2 -30 Z" fill="#8c5540"/>
          <circle cx="-4" cy="-24" r="2.6" fill="#1c2340"/>
        </g>
        <g transform="translate(986 590)">
          <path d="M -28 0 Q -30 -32 -8 -38 Q 16 -42 18 -20 Q 20 -6 8 0 Z" fill="#c6bba6"/>
          <path d="M -16 -36 Q -26 -60 -38 -56 Q -28 -42 -26 -30 Z" fill="#c6bba6"/>
          <path d="M 2 -38 Q 14 -58 26 -52 Q 12 -42 10 -30 Z" fill="#c6bba6"/>
          <circle cx="-2" cy="-26" r="2.4" fill="#1c2340"/>
        </g>
      </g>

      <!-- Estrellitas de fondo del disco -->
      <g data-layer="decorations" opacity="0.7">
        <circle cx="610" cy="426" r="3" fill="#9a76ad"/>
        <circle cx="986" cy="404" r="2.6" fill="#f0dca6"/>
        <circle cx="650" cy="706" r="2.4" fill="#f0dca6"/>
        <circle cx="958" cy="698" r="3" fill="#9a76ad"/>
      </g>
    </g>
  
</svg>
